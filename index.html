<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sādhanā Report — Daily Spiritual Practice Tracker</title>
  <meta name="description" content="A beautiful, interactive tracker for monitoring daily spiritual discipline, chanting rounds, reading, hearing, and sleep quality.">
  <link rel="stylesheet" href="./src/index.css">
  
  <!-- PWA Support -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#7A3B5E">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('Service worker registered!', reg))
          .catch(err => console.log('Service worker failed', err));
      });
    }
  </script>
  
  <!-- Import maps for browser ES Modules -->
  <script type="importmap">
    {
      "imports": {
        "preact": "https://esm.sh/preact@10.19.2",
        "preact/hooks": "https://esm.sh/preact@10.19.2/hooks",
        "htm": "https://esm.sh/htm@3.1.1",
        "html2canvas": "https://esm.sh/html2canvas@1.4.1",
        "jspdf": "https://esm.sh/jspdf@2.5.1",
        "firebase/app": "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js"
      }
    }
  </script>
</head>
<body>
  <div id="root">
    <div style="display: flex; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif; color: #6B5E4F; background: #F1E9D8;">
      <p style="font-size: 1.2rem; letter-spacing: 0.05em; font-weight: 500;">Loading Sādhanā Report...</p>
    </div>
  </div>
  
  <script type="module" src="./src/main.js"></script>
</body>
</html>
