<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sādhanā Report — Daily Spiritual Practice Tracker</title>
  <meta name="description" content="A beautiful, interactive tracker for monitoring daily spiritual discipline, chanting rounds, reading, hearing, and sleep quality.">
  <link rel="stylesheet" href="./src/index.css">
  
  <!-- PWA Support -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#100C1F">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <style>
    /* Critical Inline Splash Screen Styles (Instant Load) */
    .splash-overlay {
      position: fixed;
      inset: 0;
      background-color: #100C1F;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.4s ease, visibility 0.4s ease;
      font-family: 'Inter', sans-serif;
    }
    .splash-overlay.splash-fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .splash-content {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .splash-title {
      font-family: 'Fraunces', serif;
      font-size: 32px;
      color: #FBF1E0;
      margin: 24px 0 4px;
      letter-spacing: 0.08em;
      opacity: 0;
      transform: translateY(10px);
      animation: splashFadeIn 0.8s ease 0.5s forwards;
    }
    .splash-subtitle {
      font-family: 'Fraunces', serif;
      font-style: italic;
      font-size: 14px;
      color: #E8923A;
      margin: 0;
      letter-spacing: 0.05em;
      opacity: 0;
      transform: translateY(10px);
      animation: splashFadeIn 0.8s ease 0.8s forwards;
    }
    @keyframes splashFadeIn {
      to { opacity: 1; transform: translateY(0); }
    }
    .splash-logo-anim {
      animation: splashScaleIn 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }
    .splash-logo-anim .logo-beads-group {
      transform-origin: 100px 100px;
      animation: splashRotateBeads 1.2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }
    .splash-logo-anim .logo-lotus-group {
      transform-origin: 100px 100px;
      transform: scale(0);
      animation: splashScaleIn 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) 0.35s forwards;
    }
    @keyframes splashScaleIn {
      to { transform: scale(1); }
    }
    @keyframes splashRotateBeads {
      from { transform: rotate(-180deg); opacity: 0; }
      to { transform: rotate(0deg); opacity: 1; }
    }
  </style>
  
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').then((reg) => {
          console.log('Service worker registered!', reg);
          
          // Force activation if there's already an update waiting
          if (reg.waiting) {
            console.log('New service worker waiting. Activating...');
            reg.waiting.postMessage({ type: 'SKIP_WAITING' });
            return;
          }

          // Force activation if an update is found during lifecycle
          reg.onupdatefound = () => {
            const installingWorker = reg.installing;
            installingWorker.onstatechange = () => {
              if (installingWorker.state === 'installed') {
                if (navigator.serviceWorker.controller) {
                  console.log('New content available. Activating update...');
                  if (reg.waiting) {
                    reg.waiting.postMessage({ type: 'SKIP_WAITING' });
                  }
                }
              }
            };
          };
        }).catch(err => console.log('Service worker failed', err));
      });

      // Reload page immediately when service worker takes control
      let refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (!refreshing) {
          refreshing = true;
          console.log('Service worker updated. Reloading page...');
          window.location.reload();
        }
      });
    }

    // PWA Custom Install Prompt capture
    window.deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      window.deferredPrompt = e;
      window.dispatchEvent(new CustomEvent('pwa-prompt-available'));
      console.log('PWA beforeinstallprompt captured!');
    });
  </script>
  
  <!-- Import maps for browser ES Modules -->
  <script type="importmap">
    {
      "imports": {
        "preact": "https://esm.sh/preact@10.19.2",
        "preact/hooks": "https://esm.sh/preact@10.19.2/hooks",
        "htm": "https://esm.sh/htm@3.1.1",
        "html2canvas": "https://esm.sh/html2canvas@1.4.1",
        "jspdf": "https://esm.sh/jspdf@2.5.1",
        "firebase/app": "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js"
      }
    }
  </script>
</head>
<body>

          <circle cx="61.0" cy="167.5" r="3.5" fill="#C5993B" />
          <circle cx="44.8" cy="155.2" r="3.5" fill="#C5993B" />
          <circle cx="32.5" cy="139.0" r="3.5" fill="#C5993B" />
          <circle cx="24.7" cy="120.2" r="3.5" fill="#C5993B" />
          <circle cx="22.0" cy="100.0" r="3.5" fill="#C5993B" />
          <circle cx="24.7" cy="79.8" r="3.5" fill="#C5993B" />
          <circle cx="32.5" cy="61.0" r="3.5" fill="#C5993B" />
          <circle cx="44.8" cy="44.8" r="3.5" fill="#C5993B" />
          <circle cx="61.0" cy="32.5" r="3.5" fill="#C5993B" />
          <circle cx="79.8" cy="24.7" r="3.5" fill="#C5993B" />

          <circle cx="155.2" cy="44.8" r="3.5" fill="#C5993B" />

          <circle cx="175.3" cy="79.8" r="3.5" fill="#C5993B" />
        </g>
        <circle cx="100" cy="100" r="32" fill="none" stroke="#C5993B" stroke-width="1" opacity="0.6" />
        <!-- Lotus Petals -->
        <g class="logo-lotus-group">
          <path d="M 100,100 C 90,82 90,56 100,44 C 110,56 110,82 100,100 Z" fill="#D4AF37" transform="rotate(0 100 100) scale(1)" />

          <path d="M 100,100 C 90,82 90,56 100,44 C 110,56 110,82 100,100 Z" fill="#FFFDF0" transform="rotate(90 100 100) scale(0.85)" />
          <path d="M 100,100 C 90,82 90,56 100,44 C 110,56 110,82 100,100 Z" fill="#D4AF37" transform="rotate(120 100 100) scale(1)" />
          <path d="M 100,100 C 90,82 90,56 100,44 C 110,56 110,82 100,100 Z" fill="#FFFDF0" transform="rotate(150 100 100) scale(0.85)" />
          <path d="M 100,100 C 90,82 90,56 100,44 C 110,56 110,82 100,100 Z" fill="#D4AF37" transform="rotate(180 100 100) scale(1)" />
          <path d="M 100,100 C 90,82 90,56 100,44 C 110,56 110,82 100,100 Z" fill="#FFFDF0" transform="rotate(210 100 100) scale(0.85)" />
          <path d="M 100,100 C 90,82 90,56 100,44 C 110,56 110,82 100,100 Z" fill="#D4AF37" transform="rotate(240 100 100) scale(1)" />
          <path d="M 100,100 C 90,82 90,56 100,44 C 110,56 110,82 100,100 Z" fill="#FFFDF0" transform="rotate(270 100 100) scale(0.85)" />
          <path d="M 100,100 C 90,82 90,56 100,44 C 110,56 110,82 100,100 Z" fill="#D4AF37" transform="rotate(300 100 100) scale(1)" />
          <path d="M 100,100 C 90,82 90,56 100,44 C 110,56 110,82 100,100 Z" fill="#FFFDF0" transform="rotate(330 100 100) scale(0.85)" />
        </g>
        <circle cx="100" cy="100" r="14" fill="#E8923A" stroke="#D4AF37" stroke-width="2" />
        <circle cx="100" cy="100" r="8" fill="#F4B860" opacity="0.8" />
      </svg>
      <h1 class="splash-title">Sadhana Card</h1>
      <p class="splash-subtitle">harer nāmaiva kevalam</p>
    </div>
  </div>

  <div id="root">
    <!-- App mounts here -->

  <script type="module" src="./src/main.js"></script>
</body>
</html>
